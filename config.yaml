# ============================================================
# PIANO FINANZIARIO FAMILIARE — Configurazione
# I valori numerici reali (patrimonio, quantità, stipendi)
# vivono esclusivamente su Supabase (config_params, asset_catalog,
# posizioni). Questo file contiene solo parametri generici,
# metadati pubblici degli asset e la struttura per il fallback.
# ============================================================

famiglia:
  aggiornato: "2026-09"

# ─── PARAMETRI FINANZIARI CENTRALIZZATI ──────────────────────
# Aliquote, rendimenti assunti, spread scenari.
parametri:
  aliquota_capital_gain: 0.26
  rendimento_etf_base: 0.07
  rendimento_etf_worst: 0.03
  rendimento_etf_best: 0.10
  rendimento_fondi_base: 0.04
  rendimento_fondi_worst: 0.00
  rendimento_fondi_best: 0.08
  ter_default: 0.02
  rendimento_generali: 0.03
  data_inizio_storico: "2024-01-01"
  etf_destinazione_migrazione: "IWDA / VWCE"
  scenario_spread_worst: 0.04
  scenario_spread_best: 0.03
  rimborso_annuale_default: 22000
  # FIRE — configurabili da config_params Supabase (chiavi: fire_spese_annue, fire_eta_pensione, fire_eta_attuale)
  fire_tasso_prelievo: 0.04
  fire_rendimento: 0.07
